name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.0'
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application and registry
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Verify generated registry is current
        run: git diff --exit-code -- public/r public/foundation.css
